name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build-release --config Release

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $artifacts = "build-release/BetterArchetype_artefacts/Release"

          Compress-Archive `
            -Path "$artifacts/Standalone/BetterArchetype.exe" `
            -DestinationPath "dist/BetterArchetype-${env:GITHUB_REF_NAME}-Windows-Standalone.zip" `
            -Force

          Compress-Archive `
            -Path "$artifacts/VST3/BetterArchetype.vst3" `
            -DestinationPath "dist/BetterArchetype-${env:GITHUB_REF_NAME}-Windows-VST3.zip" `
            -Force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${env:GITHUB_REF_NAME}" dist/*.zip `
            --title "BetterArchetype ${env:GITHUB_REF_NAME}" `
            --generate-notes